name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show CMake version
        shell: pwsh
        run: cmake --version

      - name: Configure with Visual Studio 2022
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Stage VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          if (-not $plugin) {
            Get-ChildItem -Path build -Recurse | Select-Object FullName
            throw "Nessun bundle VST3 trovato"
          }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Path $plugin.FullName -Destination "artifact\RumbleSweep.vst3" -Recurse -Force
          Get-ChildItem -Path artifact -Recurse | Select-Object FullName

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: RumbleSweep-Windows-VST3
          path: artifact/RumbleSweep.vst3
          if-no-files-found: error

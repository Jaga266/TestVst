name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show CMake version
        shell: pwsh
        run: cmake --version

      - name: Configure with Visual Studio 2022
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "Rumble Sweep.vst3" | Select-Object -First 1
          if (-not $plugin) { throw "Rumble Sweep.vst3 non trovato" }
          Compress-Archive -Path $plugin.FullName -DestinationPath RumbleSweep-Windows-VST3.zip

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: RumbleSweep-Windows-VST3
          path: RumbleSweep-Windows-VST3.zip
          if-no-files-found: error
